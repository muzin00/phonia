[project]
name = "phoneme-verification-evaluation"
version = "0.1.0"
description = "Frozen Phase 6 utterance verification evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.3",
    "torch==2.14.1",
    "matplotlib>=3.10,<4",
]

[dependency-groups]
dev = ["ruff>=0.16.10,<0.17"]

[tool.uv]
package = false

[tool.ruff.lint]
ignore = ["E402"]
