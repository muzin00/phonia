[project]
name = "phoneme-verification"
version = "0.1.0"
description = "Phase 5 vowel comparison and score fusion with a frozen encoder"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.3",
    "torch==2.14.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10,<0.17",
]

[tool.uv]
package = false

[tool.ruff.lint]
ignore = ["E402"]
